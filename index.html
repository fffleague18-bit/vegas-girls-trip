<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3A1240">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Splitzy">
<title>Splitzy</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like a phone wallet — marquee header with bulb border, sticky tab bar, stacked sections. */
:root{
  --bg:#FBF5F2; --surface:#FFFFFF; --sunk:#F5ECEE; --ink:#2A1630; --muted:#7A6478; --line:#EADBE3;
  --accent:#B8155A; --accent-ink:#FFFFFF; --accent-soft:#F9E1EB; --gold:#B8860B; --marquee:#3A1240; --marquee-ink:#FFF4DA;
  --pos:#1D7A4E; --pos-soft:#E1F3E9; --neg:#B3261E; --neg-soft:#FBE4E1;
  --c1:#B8155A; --c2:#6A3FB5; --c3:#1D7A8C; --c4:#C2621A; --c5:#2E7D32; --c6:#8E2C8A; --c7:#3949AB; --c8:#A1522F;
  --display:"Limelight", "Didot", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#170D1C; --surface:#22152A; --sunk:#1C1123; --ink:#F7EAF1; --muted:#B9A2B6; --line:#3A2843;
  --accent:#FF5C9A; --accent-ink:#2A0716; --accent-soft:#3D1A2E; --gold:#E9BD55; --marquee:#2B0F33; --marquee-ink:#FFF1CC;
  --pos:#62D39C; --pos-soft:#153326; --neg:#FF8F85; --neg-soft:#3A1B1A;
  --c1:#FF5C9A; --c2:#A98BF0; --c3:#4FC3D4; --c4:#F2A15B; --c5:#7BCF80; --c6:#E07ADB; --c7:#8C9EFF; --c8:#E39A78;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#170D1C; --surface:#22152A; --sunk:#1C1123; --ink:#F7EAF1; --muted:#B9A2B6; --line:#3A2843;
  --accent:#FF5C9A; --accent-ink:#2A0716; --accent-soft:#3D1A2E; --gold:#E9BD55; --marquee:#2B0F33; --marquee-ink:#FFF1CC;
  --pos:#62D39C; --pos-soft:#153326; --neg:#FF8F85; --neg-soft:#3A1B1A;
  --c1:#FF5C9A; --c2:#A98BF0; --c3:#4FC3D4; --c4:#F2A15B; --c5:#7BCF80; --c6:#E07ADB; --c7:#8C9EFF; --c8:#E39A78;
  color-scheme:dark }

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* Marquee header */
.marquee{border-radius:22px;padding:11px;background:radial-gradient(circle,var(--gold) 2.4px,transparent 3.2px) 0 0/15px 15px,var(--marquee)}
.marquee-in{border-radius:13px;background:var(--marquee);color:var(--marquee-ink);padding:20px 20px 18px;display:grid;gap:10px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.marquee h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,46px);line-height:1.05;letter-spacing:.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;opacity:.92}
.meta b{font-weight:600}
.countdown{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--gold) 22%,transparent);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;width:max-content;max-width:100%}
.syncnote{font-size:12px;color:var(--muted);margin:8px 4px 0}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--muted);text-decoration:none}
.tab[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Sections */
main{display:grid;gap:22px;margin-top:18px}
.sec{display:grid;gap:10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:19px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}
.btn.danger.armed{background:var(--neg);color:var(--surface);border-color:var(--neg)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink)}

.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv a{color:var(--accent)}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.tile .v{font-size:16px}}

/* Girls */
.girls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.girl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;cursor:pointer;text-align:left}
.girl:hover{border-color:var(--accent)}
.girl-top{display:flex;align-items:center;gap:10px;min-width:0}
.girl-top div{min-width:0}
.girl-name{font-weight:700;font-size:16px}
.small{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--surface);background:var(--c1)}
.av.xs{width:24px;height:24px;font-size:10px;border:2px solid var(--surface)}
.stack{display:flex}.stack .av.xs+.av.xs{margin-left:-6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--sunk);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%}

/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row-main{min-width:0;display:grid;gap:3px}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-amt{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row-amt small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px}
.dayhead h3{font-size:15px;font-weight:700}
.daynum{font-family:var(--display);font-size:22px;color:var(--accent);font-weight:400;margin-right:8px}
.time{font-family:var(--num);font-size:13px;color:var(--accent);font-weight:600;min-width:62px}
.plan{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:start}
.plan:first-child{border-top:0}
.plan:hover{background:var(--sunk)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:14px}

/* Settle */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
th,td{padding:10px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{border-top:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
th:first-child,td:first-child{text-align:left}
td.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.pos{background:var(--pos-soft)}.pill.neg{background:var(--neg-soft)}.pill.even{background:var(--sunk);color:var(--muted)}
.xfer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.xfer:first-child{border-top:0}
.xfer-pay{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.paybtns{display:flex;flex-wrap:wrap;gap:6px}
.paybtn{text-decoration:none;color:var(--ink)}
.xfer-who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.arrow{color:var(--muted);font-size:13px}
.xfer-amt{font-family:var(--num);font-weight:600;font-size:17px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 84px;gap:10px;align-items:center;font-size:14px}
.bar-track{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.bar .num{text-align:right}
@media (max-width:420px){.bar{grid-template-columns:86px 1fr 74px}}
.editlink{display:block;font-family:var(--body);font-size:12px;font-weight:700;color:var(--accent);margin-top:2px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.charges{display:grid;gap:4px;margin-top:4px}
.plancharges{grid-column:1/-1;min-width:0}
.plancharges .charges{margin-top:0}
.charge{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:14px}
.charge:hover{border-color:var(--accent)}
.charge .editlink{margin:0}
.charge-t{min-width:0;overflow-wrap:break-word}
.hotelcard{display:grid;gap:12px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tap{cursor:pointer}
.tap:hover td{background:var(--sunk)}
.namelink{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.allset{background:var(--pos-soft);color:var(--pos);border-radius:var(--r);padding:14px 16px;font-weight:600}

/* Modal */
.overlay{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
@media (min-width:640px){.overlay{align-items:center;padding:20px}.sheet{border-radius:20px}}
.sheet h2{font-size:20px}
.fields{display:grid;gap:12px}
.f{display:grid;gap:4px;min-width:0}
.f label,.f .lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:16px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.checks{display:grid;gap:6px}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.check input[type=number]{width:110px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:15px}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content}
.seg button{border:0;background:var(--bg);padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.err{color:var(--neg);font-size:14px;font-weight:600}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.foot .right{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.signin{max-width:420px;margin:22px auto 0;display:grid;gap:14px}
.signin .panel{display:grid;gap:12px;padding:20px}
.signin h2{font-size:20px}
.signin input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;width:100%}
.signin .btn{padding:11px 14px;font-size:15px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px}
.lblrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.quick{display:inline-flex;gap:14px}
.quick .linkbtn{font-size:13px}
.marquee-in.hasphoto{background-size:cover;background-position:center}
.marquee-in.hasphoto h1,.marquee-in.hasphoto .meta{text-shadow:0 1px 8px rgba(0,0,0,.45)}
.bannerpick{display:grid;gap:8px}
.bannerprev{height:96px;border-radius:12px;border:1px dashed var(--line);background:var(--sunk) center/cover no-repeat;display:grid;place-items:center}
.gamb{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px}
.row-amt.pos,.tile .v.pos{color:var(--pos)}
.treatchip{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.nights{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.nights input{width:52px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-size:14px}
.budgetbar{display:block;height:6px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:4px;max-width:260px}
.budgetbar span{display:block;height:100%;border-radius:4px}
.depositme{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-color:transparent}
.imin{border-color:var(--accent);color:var(--accent)}
.imin.on{background:var(--accent);color:var(--accent-ink)}
.receiptbox{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}
.wrapprev{display:grid;place-items:center;min-height:200px;background:var(--sunk);border-radius:12px;overflow:hidden}
.wrapprev img{width:100%;max-width:340px;height:auto;display:block;border-radius:12px}
.archived{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sharepanel{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sharepanel .code{font-size:26px;font-weight:600;letter-spacing:.12em;margin:2px 0 4px;overflow-wrap:anywhere}
.sharebtns{display:flex;gap:8px;flex-wrap:wrap}
.endpanel{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tripgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tripcard{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.tripcard:hover{border-color:var(--accent)}
.tripcard-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tripcard-name{font-family:var(--display);font-size:24px;line-height:1.15;color:var(--ink)}
.homebtns{display:flex;gap:8px;flex-wrap:wrap}
.userbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;cursor:pointer;padding:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>

<script>
(function(){
const COLS=['girls','expenses','plans','payments','hotels'];
const S={trip:{},girls:[],expenses:[],plans:[],payments:[],hotels:[],loaded:false};
const TRIPS_KEY='tripbook-trips',ACTIVE_KEY='tripbook-active';
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const lsSet=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
let ACTIVE=null; /* {id, code} of the open trip */
const meKey=()=>'tripbook-me:'+(ACTIVE?ACTIVE.id:'local');
const meId=()=>{const id=lsGet(meKey());return id&&girl(id)?id:null};
function myTrips(){try{const a=JSON.parse(lsGet(TRIPS_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function saveTrips(a){lsSet(TRIPS_KEY,JSON.stringify(a))}
function upsertTrip(t){const a=myTrips();const i=a.findIndex(x=>x.id===t.id);if(i<0)a.push({added:Date.now(),...t});else a[i]={...a[i],...t};saveTrips(a)}
function forgetTrip(id){saveTrips(myTrips().filter(t=>t.id!==id));lsSet('tripbook-me:'+id,'')}
/* One-time move from the single-trip version on this phone. */
(function migrate(){

/* Members of the hotel or activity an expense is linked to (live), or null if not linked / link deleted. */
function members(e){

/* Split cents by weights; leftover cents go one each to the first girls so totals always match. */
function splitWeighted(amount,ids,w){
  const out={};const tw=ids.reduce((t,id)=>t+w(id),0);if(!tw)return out;
  let used=0;const raw=ids.map(id=>{const v=Math.floor(amount*w(id)/tw);used+=v;return [id,v]});
  let rem=amount-used;raw.forEach(([id,v])=>{out[id]=v+(rem>0&&w(id)>0?1:0);if(rem>0&&w(id)>0)rem--});
  return out;
}
/* Payment apps: each girl can list Venmo, Cash App, PayPal and Zelle. Older single field "payHandle" still works. */
function payApps(g){
  if(!g)return {};const a={venmo:g.venmo||'',cashapp:g.cashapp||'',paypal:g.paypal||'',zelle:g.zelle||''};
  const h=(g.payHandle||'').trim();
  if(h&&!a.venmo&&!a.cashapp&&!a.paypal&&!a.zelle){if(/^\$/.test(h))a.cashapp=h;else if(/paypal/i.test(h))a.paypal=h;else if(/zelle|\d{3}.*\d{4}|@.+\./i.test(h)&&!/^@/.test(h))a.zelle=h.replace(/zelle:?/i,'').trim();else a.venmo=h}
  return a;
}
const clean=(v,re)=>String(v||'').trim().replace(re,'');
function payLinks(toId,amt,note){
  const a=payApps(girl(toId));const d=(amt/100).toFixed(2);const out=[];
  if(a.venmo){const u=clean(a.venmo,/^@|^https?:\/\/(www\.)?venmo\.com\/(u\/)?/i);out.push({app:'Venmo',href:`https://venmo.com/${encodeURIComponent(u)}?txn=pay&amount=${d}&note=${encodeURIComponent(note)}`})}

  if(a.paypal){const u=clean(a.paypal,/^https?:\/\/(www\.)?paypal\.me\/|^paypal\.me\/|^@/i);out.push({app:'PayPal',href:`https://paypal.me/${encodeURIComponent(u)}/${d}`})}

const TREAT_LABELS=['Bride','Birthday girl','Bachelorette','Bride-to-be','Mom-to-be','Graduate','Guest of honor','Newly single','Retiree','Promotion queen'];
const treats=()=>(S.trip.treats||[]).filter(t=>girl(t.girl));
const treatOf=id=>treats().find(t=>t.girl===id);
/* Is girl `id` being treated on expense e? Expense choice wins; otherwise the treat's default. */
function treatedOn(e,id){const t=treatOf(id);if(!t)return false;if(e.treat&&id in e.treat)return !!e.treat[id];return t.scope!=='pick'}
function hotelNights(h){const a=pd(h.checkIn),b=pd(h.checkOut);return a&&b&&b>a?Math.round((b-a)/864e5):0}
function nightsFor(h,id){const full=hotelNights(h);const n=h.nights&&h.nights[id];return n>0?n:(full||1)}
function shares(e){
  let out={};
  if(e.splitMode==='custom'){for(const k in (e.custom||{}))if(e.custom[k])out[k]=e.custom[k];return out}
  let among=e.splitAmong||[];
  if(e.splitMode==='linked'){const m=members(e);if(m&&m.filter(girl).length)among=m}
  const ids=sortedGirls().map(g=>g.id).filter(id=>among.includes(id));
  if(!ids.length)return out;
  const h=e.splitMode==='linked'&&e.linkType==='hotel'?hotel(e.linkId):null;
  out=h?splitWeighted(e.amountCents,ids,id=>nightsFor(h,id)):splitWeighted(e.amountCents,ids,()=>1);
  /* Treats: a treated girl's share is spread over the others included (weighted the same way). */
  const treated=ids.filter(id=>treatedOn(e,id)),payers=ids.filter(id=>!treatedOn(e,id));
  if(treated.length&&payers.length){
    const pool=treated.reduce((t,id)=>t+out[id],0);treated.forEach(id=>out[id]=0);
    const add=h?splitWeighted(pool,payers,id=>nightsFor(h,id)):splitWeighted(pool,payers,()=>1);
    payers.forEach(id=>out[id]+=add[id]||0);
    treated.forEach(id=>delete out[id]);
  }
  return out;
}
function balances(){
  const b={};sortedGirls().forEach(g=>b[g.id]={paid:0,share:0,sent:0,recv:0});
  const ensure=id=>b[id]||(b[id]={paid:0,share:0,sent:0,recv:0});
  S.expenses.forEach(e=>{ensure(e.paidBy).paid+=e.amountCents||0;const sh=shares(e);for(const k in sh)ensure(k).share+=sh[k]});
  S.payments.forEach(p=>{ensure(p.from).sent+=p.amountCents||0;ensure(p.to).recv+=p.amountCents||0});
  for(const k in b)b[k].net=b[k].paid-b[k].share+b[k].sent-b[k].recv;
  return b;
}
function transfers(b){
  const cred=[],debt=[];
  for(const k in b){const n=b[k].net;if(n>0)cred.push({id:k,n});else if(n<0)debt.push({id:k,n:-n})}
  cred.sort((a,c)=>c.n-a.n);debt.sort((a,c)=>c.n-a.n);
  const out=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){const amt=Math.min(debt[i].n,cred[j].n);if(amt>0)out.push({from:debt[i].id,to:cred[j].id,amt});debt[i].n-=amt;cred[j].n-=amt;if(!debt[i].n)i++;if(!cred[j].n)j++}
  return out;
}

const tooMany=e=>/too many/i.test((e&&e.message)||'');
const LOCKED='Too many wrong passcodes from this device. Wait 15 minutes and try again.';
function supaBackend(sb,TRIP,code){
  const apply=row=>{
    if(!row||row.trip_id!==TRIP)return;
    if(row.kind==='trip'){S.trip={...(row.data||{})};return}
    if(!COLS.includes(row.kind))return;
    const itemId=row.id.slice(row.kind.length+1);const a=S[row.kind];const i=a.findIndex(x=>x.id===itemId);const r={...(row.data||{}),id:itemId};
    i<0?a.push(r):a[i]=r;
  };
  const drop=rowId=>{const k=rowId.split(':')[0];if(COLS.includes(k)){const itemId=rowId.slice(k.length+1);S[k]=S[k].filter(x=>x.id!==itemId)}};
  let sig='';
  async function loadAll(){
    const {data,error}=await sb.rpc('trip_load',{p_trip:TRIP,p_code:code});
    if(error)throw error;
    if((data||[]).some(r=>r.id==='error:passcode'))throw {code:'28P01',message:'wrong passcode'};
    const nsig=JSON.stringify((data||[]).map(r=>[r.id,r.updated_at]).sort());
    if(nsig===sig&&S.loaded)return;sig=nsig;
    COLS.forEach(c=>S[c]=[]);S.trip={};(data||[]).forEach(apply);S.loaded=true;
    upsertTrip({id:TRIP,name:S.trip.name||'',destination:S.trip.destination||'',startDate:S.trip.startDate||'',endDate:S.trip.endDate||'',status:S.trip.status||'',girls:S.girls.length});
    if(document.getElementById('overlay').hidden)render();else pendingRender=true;
    syncBanner(sb,TRIP,code);
  }
  return{
    shared:true,
    async start(onReady){
      try{await loadAll();live=true}catch(e){S.loaded=true;render();toast('Couldn’t load the trip. Check your connection and refresh.');return}
      setSync();if(onReady)onReady();
      setInterval(()=>{if(document.visibilityState==='visible')loadAll().then(()=>{live=true;setSync()}).catch(()=>{live=false;setSync()})},8000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadAll().catch(()=>{})});
    },
    async save(col,id,obj){
      const rowId=col==='trip'?'trip:main':col+':'+id;
      const {data:r,error}=await sb.rpc('trip_save',{p_trip:TRIP,p_code:code,p_id:rowId,p_kind:col,p_data:obj});
      if(error)throw error;if(r==='bad-passcode')throw {code:'28P01',message:'wrong passcode'};
      apply({trip_id:TRIP,id:rowId,kind:col,data:obj});
      if(col==='trip')upsertTrip({id:TRIP,name:obj.name||'',destination:obj.destination||'',startDate:obj.startDate||'',endDate:obj.endDate||'',status:obj.status||''});
      render();
    },
    async mineLoad(){const {data,error}=await sb.rpc('mine_load',{p_trip:TRIP,p_code:code,p_key:myKey()});if(error)throw error;return (data||[]).map(r=>({...(r.data||{}),id:r.id}))},
    async mineSave(id,obj){const {data:r,error}=await sb.rpc('mine_save',{p_trip:TRIP,p_code:code,p_key:myKey(),p_id:id,p_data:obj});if(error)throw error;if(r!=='ok')throw {code:'28P01',message:'wrong passcode'}},
    async mineDelete(id){const {data:r,error}=await sb.rpc('mine_delete',{p_trip:TRIP,p_code:code,p_key:myKey(),p_id:id});if(error)throw error;if(r!=='ok')throw {code:'28P01',message:'wrong passcode'}},
    async saveBanner(img){
      const at=img?String(Date.now()):'';
      if(img){const {data:r,error}=await sb.rpc('trip_save',{p_trip:TRIP,p_code:code,p_id:'banner:main',p_kind:'banner',p_data:{img}});if(error)throw error;if(r==='bad-passcode')throw {code:'28P01'}}
      else{await sb.rpc('trip_delete',{p_trip:TRIP,p_code:code,p_id:'banner:main'})}
      BANNER=img||'';bannerAt=at;bannerCacheSet(TRIP,at,BANNER);
      return at;
    },
    async remove(col,id){
      const rowId=col+':'+id;
      const {data:r,error}=await sb.rpc('trip_delete',{p_trip:TRIP,p_code:code,p_id:rowId});
      if(error)throw error;if(r==='bad-passcode')throw {code:'28P01',message:'wrong passcode'};
      drop(rowId);render();
    }
  };
}

/* Shrink a photo on the phone before upload: max 1400px wide JPEG. */
function shrinkImage(file){return new Promise((res,rej)=>{
  if(!file||!/^image\//.test(file.type||'image/'))return rej(new Error('Pick a photo file.'));
  const fr=new FileReader();fr.onerror=()=>rej(new Error('Couldn’t read that photo.'));
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('That photo type isn’t supported. Try a JPG or PNG.'));
    im.onload=()=>{const W=Math.min(1400,im.naturalWidth||1400);const H=Math.round((im.naturalHeight||800)*W/(im.naturalWidth||1400));
      const cv=document.createElement('canvas');cv.width=W;cv.height=H;cv.getContext('2d').drawImage(im,0,0,W,H);
      let q=.78,out=cv.toDataURL('image/jpeg',q);while(out.length>380000&&q>.4){q-=.1;out=cv.toDataURL('image/jpeg',q)}res(out)};
    im.src=fr.result};
  fr.readAsDataURL(file)})}

function tripDays(){
  const s=pd(S.trip.startDate),e=pd(S.trip.endDate);const set=new Set();
  if(s&&e&&e>=s&&(e-s)/864e5<31){for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))set.add(iso(d))}
  S.plans.forEach(p=>p.date&&set.add(p.date));
  S.hotels.forEach(h=>{h.checkIn&&set.add(h.checkIn);h.checkOut&&set.add(h.checkOut)});
  S.expenses.filter(x=>x.ride&&x.date&&x.ride.time).forEach(x=>set.add(x.date));
  return [...set].sort();
}

      <div class="row-main"><span class="row-title">${esc(x.ride.service||'Ride')}: ${esc(x.ride.from||'?')} → ${esc(x.ride.to||'?')}</span><span class="small">Paid by ${esc(gname(x.paidBy))} · <span class="num">${fmt(x.amountCents)}</span></span></div>
      <span class="chip">Ride</span></div>`;
  const out=days.map(d=>{
    const ps=S.plans.filter(p=>p.date===d);const rs=S.expenses.filter(x=>x.ride&&x.date===d&&x.ride.time);
    const hin=S.hotels.filter(h=>h.checkIn===d),hout=S.hotels.filter(h=>h.checkOut===d);
    const items=[...hout.map(h=>({t:'00',h:stay(h,'out')})),...ps.map(p=>({t:p.time||'99',h:item(p)})),...rs.map(x=>({t:x.ride.time,h:ride(x)})),...hin.map(h=>({t:'15',h:stay(h,'in')}))].sort((a,b)=>a.t.localeCompare(b.t));
    const dd=pd(d);
    return `<div class="sec"><div class="dayhead"><h3><span class="daynum">${dd.getDate()}</span>${dd.toLocaleDateString('en-US',{weekday:'long',month:'long'})}</h3><button class="btn sm" data-act="plan-new" data-date="${d}">Add</button></div>
      ${items.length?`<div class="list">${items.map(i=>i.h).join('')}</div>`:`<div class="empty" style="padding:12px">Free day — nothing booked</div>`}</div>`;
  }).join('');
  return `<section class="sec">${head}</section>${out}${undated.length?`<section class="sec"><div class="dayhead"><h3>Ideas — no date yet</h3></div><div class="list">${undated.map(item).join('')}</div></section>`:''}`;
}

function expRow(e){

  const split=e.splitMode==='linked'&&ln?`split ${n} way${n===1?'':'s'} · ${ln}`:e.splitMode==='custom'?'custom split':n===S.girls.length&&n>1?'split with everyone':n===1?'for '+gname(Object.keys(shares(e))[0]):`split ${n} ways`;
  return `<div class="row" data-act="exp-edit" data-id="${e.id}">
    <div class="row-main"><span class="row-title">${esc(e.title)}</span>
      <span class="small"><span class="chip"><span class="dot" style="background:${catColor(e.category)}"></span>${esc(e.category)}</span> Paid by <b>${esc(gname(e.paidBy))}</b>${e.card?' · '+esc(e.card):''}${(()=>{const inc=e.splitMode==='custom'?[]:(e.splitMode==='linked'&&members(e)?members(e):(e.splitAmong||[]));const tr=treats().filter(t=>inc.includes(t.girl)&&treatedOn(e,t.girl));return tr.length?' · 🎉 treating '+esc(tr.map(t=>gname(t.girl).split(' ')[0]).join(', ')):''})()}</span></div>
    <span class="row-amt">${fmt(e.amountCents)}<small>${esc(split)}</small><span class="editlink">Edit</span></span></div>`;
}
function vExpenses(){

  ${list.length?dates.map(d=>`<section class="sec"><div class="dayhead"><h3>${d?dLong(d):'No date'}</h3><span class="sub num">${fmt(byDate[d].reduce((s,e)=>s+e.amountCents,0))}</span></div><div class="list">${byDate[d].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(expRow).join('')}</div></section>`).join(''):`<div class="empty"><b>No expenses yet</b><span>Log the hotel deposit, dinner, bottle service, anything someone pays for the group. Pick who paid, which card, and who it’s split between.</span><button class="btn primary" data-act="exp-new">Add the first expense</button></div>`}`;
}

function vSettle(){
  if(!S.girls.length)return `<section class="sec"><div class="sec-head"><h2>Who owes who</h2></div>${needGirls()}</section>`;
  const b=balances();const xs=transfers(b);
  const rows=sortedGirls().map(g=>{const r=b[g.id];const n=r.net;
    return `<tr class="tap" data-act="girl-breakdown" data-id="${g.id}"><td><span style="display:inline-flex;align-items:center;gap:8px">${av(g.id,'xs')}<b class="namelink">${esc(g.name)}</b></span></td><td class="n">${fmt(r.paid)}</td><td class="n">${fmt(r.share)}</td><td class="n">${fmt(r.sent-r.recv)}</td>
      <td>${n>0?`<span class="pill pos num">gets ${fmt(n)}</span>`:n<0?`<span class="pill neg num">owes ${fmt(-n)}</span>`:'<span class="pill even">even</span>'}</td></tr>`}).join('');
  const byCard={};S.expenses.forEach(e=>{const k=(e.card||'Card not noted').trim()+'|'+e.paidBy;byCard[k]=(byCard[k]||0)+e.amountCents});
  const cardRows=Object.entries(byCard).sort((a,c)=>c[1]-a[1]);
  const byCat={};S.expenses.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+e.amountCents);
  const cats=Object.entries(byCat).sort((a,c)=>c[1]-a[1]);const max=cats[0]?.[1]||1;
  return `<section class="sec">
    <div class="sec-head"><div><h2>Who owes who</h2><div class="sub">The fewest payments that make everyone even.</div></div><div class="btnrow"><button class="btn sm" data-act="wrapped">🎁 Trip Wrapped</button><button class="btn sm" data-act="copy">Copy summary</button></div></div>
    ${!S.expenses.length?`<div class="empty"><b>Nothing to settle yet</b><span>Once expenses are logged, this shows exactly who sends money to whom.</span></div>`:
    xs.length?`<div class="list">${xs.map(x=>{const to=girl(x.to);return `<div class="xfer"><div class="xfer-who">${av(x.from,'xs')}<b>${esc(gname(x.from))}</b><span class="arrow">pays</span>${av(x.to,'xs')}<b>${esc(gname(x.to))}</b></div>
      <div style="display:flex;align-items:center;gap:10px"><span class="xfer-amt num">${fmt(x.amt)}</span><button class="btn sm" data-act="pay-new" data-from="${x.from}" data-to="${x.to}" data-amt="${x.amt}">Mark paid</button></div>
      ${payButtons(x.from,x.to,x.amt,'Splitzy · '+(S.trip.name||'trip'))?`<div class="xfer-pay">${payButtons(x.from,x.to,x.amt,'Splitzy · '+(S.trip.name||'trip'))}<span class="small">After paying, tap Mark paid.</span></div>`:''}</div>`}).join('')}</div>`:
    `<div class="allset">Everyone is square. Nobody owes anybody.</div>`}
  </section>
  <section class="sec"><div class="sec-head"><h2>Balances</h2></div>
    <div class="table-wrap"><table><thead><tr><th>Girl</th><th>Paid</th><th>Her share</th><th>Settled</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="sub">Tap a name to see her full trip breakdown. Paid = what she put on her cards for the group. Her share = what she used. Settled = money she’s already sent back (minus what she’s received).</div>
  </section>
  <section class="sec"><div class="sec-head"><h2>Payments made</h2><button class="btn sm" data-act="pay-new">Record payment</button></div>
    ${S.payments.length?`<div class="list">${[...S.payments].sort((a,c)=>(c.createdAt||0)-(a.createdAt||0)).map(p=>`<div class="row" data-act="pay-edit" data-id="${p.id}"><div class="row-main"><span class="row-title">${esc(gname(p.from))} paid ${esc(gname(p.to))}${p.kind==='deposit'?' (deposit)':''}</span><span class="small">${esc([p.method,p.date&&dLong(p.date)].filter(Boolean).join(' · '))}</span></div><span class="row-amt">${fmt(p.amountCents)}<span class="editlink">Edit</span></span></div>`).join('')}</div>`:'<div class="sub">When someone pays another girl back, tap Mark paid so balances stay right.</div>'}
  </section>
  ${cardRows.length?`<section class="sec"><div class="sec-head"><h2>By credit card</h2></div><div class="list">${cardRows.map(([k,v])=>{const[c,id]=k.split('|');return `<div class="row" style="cursor:default"><div class="row-main"><span class="row-title">${esc(c)}</span><span class="small">${esc(gname(id))}</span></div><span class="row-amt">${fmt(v)}</span></div>`}).join('')}</div></section>`:''}
  ${cats.length?`<section class="sec"><div class="sec-head"><h2>Where the money went</h2></div><div class="panel bars">${cats.map(([c,v])=>`<div class="bar"><span>${esc(c)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,v/max*100)}%;background:${catColor(c)}"></div></div><span class="num">${fmt(v)}</span></div>`).join('')}</div></section>`:''}`;
}

function wrappedStats(){
  const t=S.trip;const total=S.expenses.reduce((x,e)=>x+(e.amountCents||0),0);
  const byCat={};S.expenses.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+e.amountCents);
  const topCat=Object.entries(byCat).sort((a,c)=>c[1]-a[1])[0];
  const s0=pd(t.startDate),e0=pd(t.endDate);const nights=s0&&e0&&e0>s0?Math.round((e0-s0)/864e5):Math.max(0,...S.hotels.map(hotelNights));
  const popular=[...S.plans].sort((a,c)=>(c.going||[]).filter(girl).length-(a.going||[]).filter(girl).length)[0];
  const b=balances();const fronted=Object.entries(b).sort((a,c)=>c[1].paid-a[1].paid)[0];
  const lucky=sortedGirls().filter(g=>typeof g.slotsNet==='number').sort((a,c)=>c.slotsNet-a.slotsNet)[0];
  return {total,topCat,nights,popular,fronted:fronted&&fronted[1].paid>0?{id:fronted[0],amt:fronted[1].paid}:null,lucky,
    girls:S.girls.length,acts:S.plans.filter(p=>(p.going||[]).filter(girl).length).length,rides:S.expenses.filter(e=>e.category==='Ride share').length};
}
async function drawWrapped(){
  try{await Promise.all([document.fonts.load('80px Limelight'),document.fonts.load('600 40px Figtree'),document.fonts.load('40px Figtree')])}catch(e){}
  const W=1080,H=1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const plum='#2B0F33',gold='#E9BD55',cream='#FFF4DA',pink='#FF5C9A';
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3A1240');g.addColorStop(1,'#1B0820');c.fillStyle=g;c.fillRect(0,0,W,H);
  /* banner photo across the top */
  if(BANNER){await new Promise(r=>{const im=new Image();im.onload=()=>{const bh=640,sc=Math.max(W/im.width,bh/im.height);c.save();c.beginPath();c.rect(0,0,W,bh);c.clip();c.drawImage(im,(W-im.width*sc)/2,(bh-im.height*sc)/2,im.width*sc,im.height*sc);const ov=c.createLinearGradient(0,0,0,bh);ov.addColorStop(0,'rgba(43,15,51,.25)');ov.addColorStop(1,'rgba(43,15,51,1)');c.fillStyle=ov;c.fillRect(0,0,W,bh);c.restore();r()};im.onerror=r;im.src=BANNER})}
  /* marquee bulbs */
  const m=36,step=44;c.fillStyle=gold;
  for(let x=m;x<=W-m;x+=step){[m,H-m].forEach(y=>{c.beginPath();c.arc(x,y,7,0,7);c.fill()})}
  for(let y=m+step;y<=H-m-step;y+=step){[m,W-m].forEach(x=>{c.beginPath();c.arc(x,y,7,0,7);c.fill()})}
  const wrap=(txt,x,y,maxW,lh,font,color,align='left')=>{c.font=font;c.fillStyle=color;c.textAlign=align;const words=String(txt).split(' ');let line='',yy=y;for(const w of words){const test=line?line+' '+w:w;if(c.measureText(test).width>maxW&&line){c.fillText(line,x,yy);line=w;yy+=lh}else line=test}c.fillText(line,x,yy);return yy+lh};
  const st=wrappedStats(),t=S.trip;
  let y=BANNER?470:230;
  c.font='600 34px Figtree, sans-serif';c.fillStyle=gold;c.textAlign='left';c.fillText('SPLITZY  WRAPPED',96,y);y+=40;
  y=wrap(t.name||'Our trip',96,y+70,W-192,104,'92px Limelight, Georgia, serif',cream);
  const dates=t.startDate?dShort(t.startDate)+(t.endDate?' – '+dShort(t.endDate):'')+(pd(t.endDate||t.startDate)?', '+pd(t.endDate||t.startDate).getFullYear():''):'';
  y=wrap([t.destination,dates].filter(Boolean).join(' · '),96,y-10,W-192,50,'40px Figtree, sans-serif','rgba(255,244,218,.85)');
  /* stat tiles */
  y+=30;const tiles=[[String(st.girls),'girls'],[String(st.nights||'—'),'nights'],[String(st.acts),'activities'],[fmt(st.total).replace(/\.\d\d$/,''),'spent together']];
  const tw=(W-192-30)/2,th=170;tiles.forEach(([v,l],i)=>{const x=96+(i%2)*(tw+30),yy=y+Math.floor(i/2)*(th+30);c.fillStyle='rgba(255,244,218,.08)';c.beginPath();c.roundRect?c.roundRect(x,yy,tw,th,28):c.rect(x,yy,tw,th);c.fill();c.fillStyle=pink;c.font='600 72px Figtree, sans-serif';c.textAlign='left';c.fillText(v,x+34,yy+92);c.fillStyle=cream;c.font='34px Figtree, sans-serif';c.fillText(l,x+34,yy+140)});
  y+=2*(th+30)+40;
  const line=(label,value)=>{if(!value)return;c.fillStyle=gold;c.font='600 30px Figtree, sans-serif';c.textAlign='left';c.fillText(label.toUpperCase(),96,y);y=wrap(value,96,y+56,W-192,56,'600 46px Figtree, sans-serif',cream)+18};
  if(st.topCat)line('Where the money went',`${st.topCat[0]} · ${fmt(st.topCat[1])}`);
  if(st.popular&&(st.popular.going||[]).filter(girl).length>1)line('Crowd favorite',`${st.popular.title} (${(st.popular.going||[]).filter(girl).length} girls)`);
  const tr=treats();if(tr.length)line('We treated',tr.map(x=>`the ${x.label.toLowerCase()}, ${gname(x.girl).split(' ')[0]} 🎉`).join(' & '));
  if(st.lucky&&st.lucky.slotsNet>0)line('Luckiest at the slots',`${st.lucky.name.split(' ')[0]} (up ${fmt(st.lucky.slotsNet)})`);
  else if(st.fronted)line('Fronted the most',`${gname(st.fronted.id).split(' ')[0]} · ${fmt(st.fronted.amt)}`);

  return cv;
}

/* Cards: a name plus ONLY the last 4 digits. Blocks any run of 5+ digits (spaces/dashes ignored). */
function cardErr(str){
  const parts=String(str||'').split(',').map(x=>x.trim()).filter(Boolean);
  for(const p of parts){const joined=p.replace(/(\d)[\s.-]+(?=\d)/g,'$1');if(/\d{5,}/.test(joined))return `“${p.length>24?p.slice(0,24)+'…':p}” has too many numbers. Use only the last 4 digits, like “Amex 1005”.`}
  return '';
}
function cardList(gid){const g=girl(gid);return (g?.cards||'').split(',').map(s=>s.trim()).filter(Boolean)}
function linkOptions(sel){

/* Receipt reading happens on the phone (Tesseract, loaded only when first used). Best effort: always double-check. */
let tessLoading=null;
function loadTesseract(){if(window.Tesseract)return Promise.resolve();if(tessLoading)return tessLoading;
  tessLoading=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=()=>res();sc.onerror=()=>{tessLoading=null;rej(new Error('load'))};document.head.appendChild(sc)});return tessLoading}
function parseReceipt(text){
  const lines=String(text||'').split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const money=l=>{const m=l.replace(/[Oo](?=\d)|(?<=\d)[Oo]/g,'0').match(/\$?\s*(\d{1,5}(?:,\d{3})*[.,]\d{2})(?!\d)/g);return m?m.map(x=>parseFloat(x.replace(/[$\s]/g,'').replace(/,(?=\d{3})/g,'').replace(',','.'))):[]};
  let total=null;
  for(let i=lines.length-1;i>=0&&total===null;i--){const l=lines[i];if(/total|amount due|balance due|grand/i.test(l)&&!/sub\s*-?\s*total/i.test(l)){const m=money(l);if(m.length)total=m[m.length-1]}}
  if(total===null){const all=lines.flatMap(money);if(all.length)total=Math.max(...all)}
  const merchant=(lines.find(l=>/[A-Za-z]{3,}/.test(l)&&!/receipt|welcome|thank|order|table|server|guest/i.test(l))||'').replace(/[^\w&'’ .-]/g,'').trim().slice(0,40);
  let date='';const dm=String(text).match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(dm){let [_,m,d,y]=dm;y=+y<100?2000+ +y:+y;if(+m>=1&&+m<=12&&+d>=1&&+d<=31)date=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
  return {total,merchant,date};
}
async function scanReceipt(file){
  const st=$('#rc_status');st.hidden=false;st.textContent='Reading the receipt… (the first time takes a little longer)';
  try{await loadTesseract()}catch(e){st.textContent='Couldn’t load the receipt reader. Check your connection, or type the amount.';return}
  try{
    const img=await shrinkImage(file);
    const {data}=await window.Tesseract.recognize(img,'eng');
    const r=parseReceipt(data&&data.text);
    if(r.total){$('#e_a').value=r.total.toFixed(2);$('#e_a').dispatchEvent(new Event('input',{bubbles:true}))}
    if(r.merchant&&!val('e_t'))$('#e_t').value=r.merchant;
    if(r.date)$('#e_d').value=r.date;
    st.textContent=r.total?`Found ${fmt(Math.round(r.total*100))}${r.merchant?' at '+r.merchant:''}. Please double-check it, and add the tip if it isn’t on the receipt.`:'Couldn’t find a total on that photo. Try a closer, flatter shot, or type it in.';
  }catch(e){st.textContent='Couldn’t read that photo. Try again, or type the amount.'}
}

  else if(a==='hotel-new')hotelForm();
  else if(a==='hotel-edit')hotelForm(id);
  else if(a==='hotel-charge'){const h=hotel(id);expForm(null,{category:'Hotel',title:'Room',linkType:'hotel',linkId:id,splitMode:'linked',date:h?.checkIn||todayIso()})}
  else if(a==='plan-charge'){const p=plan(id);expForm(null,{category:PLAN_CAT[p?.kind]||'Other',title:p?.title||'',linkType:'plan',linkId:id,splitMode:'linked',date:p?.date||todayIso()})}
  else if(a==='plan-new')planForm(null,t.dataset.date);
  else if(a==='plan-edit')planForm(id);
  else if(a==='pay-new')payForm(null,{from:t.dataset.from,to:t.dataset.to,amt:+t.dataset.amt||0});
  else if(a==='pay-edit')payForm(id);
  else if(a==='copy'){const txt=summaryText();try{await navigator.clipboard.writeText(txt);toast('Summary copied — paste it in the group chat')}catch(e){openModal('Settle-up summary',`<div class="f"><textarea id="sumtxt" style="min-height:220px">${esc(txt)}</textarea><span class="hint">Select all and copy.</span></div>`,{onSave:async()=>null,saveLabel:'Done'});setTimeout(()=>$('#sumtxt').select(),50)}}
});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-checkall]');if(!b)return;const pre=b.dataset.checkall;document.querySelectorAll(`input[type=checkbox][id^="${pre}"]`).forEach(cb=>{cb.checked=!!b.dataset.on})});
document.addEventListener('change',ev=>{if(ev.target.id==='fg'){filterGirl=ev.target.value;render()}});
document.addEventListener('submit',async ev=>{
  if(ev.target.id!=='mform')return;ev.preventDefault();
  const btn=ev.target.querySelector('[type=submit]');btn.disabled=true;
  const err=await modalCtx.onSave();btn.disabled=false;
  if(err)merr(err);else{closeModal();toast('Saved')}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#overlay').hidden)closeModal()});
function route(){if(SB&&!ACTIVE)return;const h=location.hash.slice(1);tab=TABS.some(t=>t[0]===h)?h:'trip';render();}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});

/* ---------- boot ---------- */
let SB=null;
function showApp(on){$('#home').hidden=on;$('#tabs').hidden=!on;$('#main').hidden=!on}
let started=false;
function startApp(sb,tr){
  ACTIVE=tr||null;
  showApp(true);
  $('#signout').hidden=!sb;$('#mytrips').hidden=!sb;
  if(started)return;started=true;
  backend=sb?supaBackend(sb,tr.id,tr.code):localBackend();
  if(tr){const c=bannerCacheGet(tr.id);if(c&&c.img){BANNER=c.img;bannerAt=c.at}}
  route();backend.start(async()=>{ensureMe();
    if(S.trip.template&&!S.trip.templateDone&&backend.shared){const k=S.trip.template;await write(()=>backend.save('trip','main',{...S.trip,templateDone:true}));await applyTemplate(k)}
  });setSync();
}
function openTrip(id){lsSet(ACTIVE_KEY,id);location.hash='';location.reload()}
function goHome(){lsSet(ACTIVE_KEY,'');location.hash='';location.reload()}

/* ---------- My Trips (home) ---------- */
function tripDates(t){const s=pd(t.startDate),e=pd(t.endDate);return s?`${dShort(t.startDate)}${e?' – '+dShort(t.endDate)+', '+e.getFullYear():''}`:'Dates not set'}
function renderHome(msg){
  ACTIVE=null;showApp(false);
  $('#signout').hidden=true;$('#mytrips').hidden=true;
  $('#sync').textContent='Only trips you’ve joined on this phone show up here.';
  const all=myTrips();
  const cur=all.filter(t=>t.status!=='ended').sort((a,b)=>(a.startDate||'9').localeCompare(b.startDate||'9'));
  const arc=all.filter(t=>t.status==='ended').sort((a,b)=>(b.endDate||'').localeCompare(a.endDate||''));
  {const h=$('#hero');h.classList.remove('hasphoto');h.style.backgroundImage=''}
  $('#hero').innerHTML=`<div class="eyebrow">Splitzy</div><h1>My Trips</h1><div class="meta"><span>${cur.length} current</span><span>${arc.length} archived</span></div>`;
  document.title='Splitzy';
  const card=t=>`<button class="tripcard" data-home="open" data-id="${esc(t.id)}">
      <span class="tripcard-top"><span class="eyebrow" style="color:var(--accent)">${esc(t.destination||(t.id==='vegas-girls-trip'?'Las Vegas, Nevada':'Girls trip'))}</span>${t.needsCode?'<span class="pill neg">New passcode needed</span>':''}</span>
      <span class="tripcard-name">${esc(t.name||'Untitled trip')}</span>
      <span class="small">${esc(tripDates(t))}${t.girls?` · ${t.girls} girl${t.girls===1?'':'s'}`:''}</span>
    </button>`;
  $('#home').innerHTML=`
    ${msg?`<div class="err" style="margin-top:14px">${esc(msg)}</div>`:''}
    <main style="display:grid;gap:22px;margin-top:18px">
      <section class="sec"><div class="sec-head"><h2>Current trips</h2></div>
        ${cur.length?`<div class="tripgrid">${cur.map(card).join('')}</div>`:`<div class="empty"><b>No current trips on this phone</b><span>Start a new trip, or join one with the passcode from the group text.</span></div>`}
        <div class="homebtns"><button class="btn primary" data-home="new">Start a new trip</button><button class="btn" data-home="join">Join a trip with a passcode</button></div>
      </section>
      <section class="sec"><div class="sec-head"><div><h2>Archive</h2><div class="sub">Trips that have ended. Open one to look back or finish paybacks.</div></div></div>
        ${arc.length?`<div class="list">${arc.map(t=>`<div class="row" data-home="open" data-id="${esc(t.id)}"><div class="row-main"><span class="row-title">${esc(t.name||'Untitled trip')}</span><span class="small">${esc([t.destination,tripDates(t)].filter(Boolean).join(' · '))}</span></div><span class="row-amt"><span class="pill even">Ended</span><button type="button" class="linkbtn editlink" data-home="forget" data-id="${esc(t.id)}">Remove from phone</button></span></div>`).join('')}</div>`:`<div class="sub">Ended trips will be kept here.</div>`}
      </section>
      ${OWNER?`<section class="sec"><div class="sec-head"><div><h2>Organizers</h2><div class="sub">Organizers can start new trips. Only you, the owner, can see this.</div></div><button class="btn primary sm" data-home="org-add">Add organizer</button></div>
        ${ORGS===null?'<div class="sub">Loading…</div>':ORGS.length?`<div class="list">${ORGS.map(o=>`<div class="row" style="cursor:default"><div class="row-main"><span class="row-title">${esc(o.name)}</span><span class="small num">${esc(o.code)}</span></div><span class="row-amt"><span class="btnrow"><button type="button" class="btn sm" data-home="org-copy" data-id="${esc(o.code)}" data-name="${esc(o.name)}">Copy invite</button><button type="button" class="btn sm danger" data-home="org-remove" data-id="${esc(o.code)}" data-name="${esc(o.name)}">Remove</button></span></span></div>`).join('')}</div>`:'<div class="sub">No organizers yet. Right now only you can start trips.</div>'}
        <div><button class="linkbtn" data-home="owner-off" style="font-size:12px">Turn off owner tools on this phone</button></div>
      </section>`:`<div><button class="linkbtn" data-home="owner-on" style="font-size:12px;color:var(--muted)">Owner tools</button></div>`}
    </main>`;
}
let OWNER=lsGet('tripbook-owner')||'',ORGS=null;
async function loadOrgs(){
  if(!SB||!OWNER)return;
  try{const {data,error}=await SB.rpc('org_list',{p_owner:OWNER});if(error)throw error;ORGS=data||[]}catch(e){ORGS=ORGS||[]}
  if(ACTIVE===null&&$('#overlay').hidden)renderHome();
}
function makeOrgCode(name){const w=(String(name).toUpperCase().match(/[A-Z]+/)||['ORG'])[0].slice(0,6);const abc='ABCDEFGHJKMNPQRSTUVWXYZ';return w+'-'+(1000+Math.floor(Math.random()*9000))+abc[Math.floor(Math.random()*abc.length)]+abc[Math.floor(Math.random()*abc.length)]}
function orgInvite(name,code){return `${name}, you’re now a trip organizer! You can start new trips in Splitzy, our trip app.

1. Open ${location.origin}/ and add it to your home screen if you haven’t.
2. On My Trips, tap “Start a new trip”.
3. Organizer code: ${code}
   (Keep this one private. It’s just for you.)
4. After you create the trip, open it and tap “Copy invite” to send the trip passcode to the girls going.`}
function ownerOnForm(){
  openModal('Owner tools',`<p class="sub" style="margin:0">Enter your owner code to manage organizers on this phone.</p>
    <div class="f"><label for="o_code">Owner code</label><input id="o_code" type="password" autocomplete="off"></div>`,
  {saveLabel:'Turn on',onSave:async()=>{
    const c=val('o_code');if(!c)return 'Enter your owner code.';
    let ok=false;try{const {data,error}=await SB.rpc('org_is_owner',{p_owner:c});if(error)throw error;ok=data===true}catch(e){return tooMany(e)?LOCKED:'Couldn’t check the code. Try again.'}
    if(!ok)return 'That isn’t the owner code.';
    OWNER=c;lsSet('tripbook-owner',c);if(!lsGet('tripbook-org'))lsSet('tripbook-org',c);ORGS=null;setTimeout(()=>{renderHome();loadOrgs()},30);return null;
  }});
}
function orgAddForm(){
  openModal('Add an organizer',`
    <div class="f"><label for="oa_name">Her name</label><input id="oa_name" placeholder="Jess"></div>
    <div class="f"><label for="oa_code">Her organizer code</label><input id="oa_code" autocomplete="off" autocapitalize="characters" spellcheck="false" style="font-family:var(--num);letter-spacing:.1em;text-transform:uppercase"><span class="hint">Made for you automatically. She uses it to start trips. Remove her anytime and the code stops working.</span></div>`,
  {saveLabel:'Add organizer',onSave:async()=>{
    const name=val('oa_name');if(!name)return 'Add her name.';
    const code=val('oa_code').toUpperCase().replace(/\s+/g,'');if(code.length<8)return 'Make the code at least 8 characters.';
    let r;try{const res=await SB.rpc('org_add',{p_owner:OWNER,p_name:name,p_code:code});if(res.error)throw res.error;r=res.data}catch(e){return tooMany(e)?LOCKED:'Couldn’t add her. Try again.'}
    if(r==='not-owner'){OWNER='';lsSet('tripbook-owner','');return 'Your owner code changed. Turn owner tools on again.'}
    if(r==='taken')return 'That code is already used. Change it a little.';
    if(r!=='ok')return 'Couldn’t add her. Try again.';
    setTimeout(()=>{loadOrgs();copyText(orgInvite(name,code),'Organizer invite for '+name,'Added! Her invite is copied. Paste it in a text to her.')},30);return null;
  }});
  {const n=$('#oa_name'),c=$('#oa_code');n.addEventListener('input',()=>{if(!c.dataset.touched)c.value=n.value.trim()?makeOrgCode(n.value):''});c.addEventListener('input',()=>c.dataset.touched='1')}
}
async function copyText(txt,title,okMsg){
  try{await navigator.clipboard.writeText(txt);toast(okMsg)}
  catch(e){openModal(title,`<div class="f"><textarea id="sharetxt" style="min-height:240px">${esc(txt)}</textarea><span class="hint">Select all and copy.</span></div>`,{onSave:async()=>null,saveLabel:'Done'});setTimeout(()=>$('#sharetxt').select(),50)}
}
async function refreshHome(){
  if(!SB)return;let changed=false;
  await Promise.all(myTrips().map(async t=>{
    try{const {data,error}=await SB.rpc('trip_load',{p_trip:t.id,p_code:t.code});
      if(error)return;
      if((data||[]).some(r=>r.id==='error:passcode')){upsertTrip({id:t.id,needsCode:true});changed=true;return}
      const tr=(data||[]).find(r=>r.id==='trip:main')?.data||{};const girls=(data||[]).filter(r=>r.kind==='girls').length;
      upsertTrip({id:t.id,needsCode:false,name:tr.name||t.name||'',destination:tr.destination||'',startDate:tr.startDate||'',endDate:tr.endDate||'',status:tr.status||'',girls});changed=true;
    }catch(e){}
  }));
  if(changed&&ACTIVE===null&&$('#overlay').hidden)renderHome();
}
function joinForm(msg){
  openModal('Join a trip',`
    ${msg?`<p class="err" style="margin:0">${esc(msg)}</p>`:''}
    <p class="sub" style="margin:0">Type the passcode from the group text for that trip.</p>
    <div class="f"><label for="j_code">Trip passcode</label><input id="j_code" autocomplete="off" autocapitalize="characters" spellcheck="false" style="font-family:var(--num);letter-spacing:.12em;font-size:18px;text-transform:uppercase"></div>`,
  {saveLabel:'Join trip',onSave:async()=>{
    const code=val('j_code').toUpperCase();if(code.length<6)return 'Type the full passcode.';
    let id=null;try{const {data,error}=await SB.rpc('trip_find',{p_code:code});if(error)throw error;id=data}catch(e){return tooMany(e)?LOCKED:'Couldn’t reach the trips. Check your connection and try again.'}
    if(!id)return 'No trip uses that passcode. Check the group text and try again.';
    upsertTrip({id,code,needsCode:false});setTimeout(()=>openTrip(id),30);return null;
  }});
}
function suggestCode(name){const w=(String(name||'').toUpperCase().match(/[A-Z]+/g)||['TRIP']).filter(x=>!['THE','GIRLS','GIRL','TRIP','A','OF'].includes(x))[0]||'TRIP';return w.slice(0,8)+(1000+Math.floor(Math.random()*9000))}
const TEMPLATES={
  vegas:{name:'Vegas weekend',items:[['Pool day at a day club','Pool party','about $50 cover'],['Big show night','Show','about $120'],['Fancy dinner on the Strip','Dinner','about $90'],['Brunch buffet','Brunch','about $60'],['Nightclub','Club','about $50 cover'],['Spa morning','Spa','about $150'],['Fremont Street night','Other','free'],['Slots & cocktails','Drinks','you decide']]},
  nashville:{name:'Nashville girls trip',items:[['Honky-tonk crawl on Broadway','Bar','free, drinks extra'],['Pedal tavern ride','Tour','about $45'],['Hot chicken lunch','Lunch','about $20'],['Opry or live music show','Show','about $80'],['Boozy brunch','Brunch','about $35'],['Line dancing lesson','Other','about $20']]},
  pool:{name:'Scottsdale / pool weekend',items:[['Pool cabana day','Pool party','about $75'],['Spa day','Spa','about $150'],['Sunset hike','Other','free'],['Old Town bar hop','Bar','about $40'],['Brunch','Brunch','about $35'],['Topgolf','Other','about $40']]},
  bach:{name:'Bachelorette weekend',items:[['Welcome dinner','Dinner','about $60'],['Matching outfits & sashes','Shopping','about $25'],['Pool party or day club','Pool party','about $50'],['Boat or party bus','Tour','about $80'],['Dance or cocktail class','Other','about $40'],['Recovery brunch','Brunch','about $35']]},
  beach:{name:'Beach getaway',items:[['Beach day setup','Other','about $30'],['Boat tour or snorkel','Tour','about $90'],['Seafood dinner','Dinner','about $60'],['Sunset drinks','Drinks','about $30'],['Massage','Spa','about $120'],['Souvenir shopping','Shopping','you decide']]},
  bday:{name:'Birthday weekend',items:[['Birthday dinner','Dinner','about $70'],['Cake & decorations','Other','about $15'],['Night out','Club','about $50'],['Nails or spa','Spa','about $60'],['Brunch','Brunch','about $35']]}
};
async function applyTemplate(key){
  const tp=TEMPLATES[key];if(!tp)return;
  const have=new Set(S.plans.map(p=>(p.title||'').toLowerCase()));let n=0;
  for(const [title,kind,cost] of tp.items){if(have.has(title.toLowerCase()))continue;
    const err=await write(()=>backend.save('plans',uid(),{title,kind,cost,date:'',going:[],fromTemplate:key,notes:'Idea from the '+tp.name+' template. Tap I’m in if you want to go.',createdAt:Date.now()+n}));if(err){toast(err);return}n++}
  toast(n?`Added ${n} ideas to the Calendar`:'Those ideas are already on the Calendar');
}
function templateForm(){
  openModal('Add ideas from a template',`<p class="sub" style="margin:0">Adds trip ideas to the Calendar under “Ideas, no date yet.” Costs are rough guesses per person. Everyone taps <b>I’m in</b> on what they want to do.</p>
    <div class="f"><label for="tp_k">Template</label><select id="tp_k">${opts(Object.entries(TEMPLATES).map(([k,v])=>[k,v.name]),'vegas')}</select></div>`,
  {saveLabel:'Add ideas',onSave:async()=>{const k=val('tp_k');setTimeout(()=>applyTemplate(k),30);return null}});
}
function newTripForm(){
  openModal('Start a new trip',`
    <div class="f"><label for="n_name">Trip name</label><input id="n_name" placeholder="Nashville Birthday Weekend"></div>
    <div class="f"><label for="n_dest">Where</label><input id="n_dest" placeholder="Nashville, Tennessee"></div>
    <div class="f"><label for="n_tp">Start from a template</label><select id="n_tp">${opts([['','Blank trip'],...Object.entries(TEMPLATES).map(([k,v])=>[k,v.name])],'')}</select><span class="hint">Adds activity ideas the girls can say “I’m in” to.</span></div>
    <div class="two"><div class="f"><label for="n_s">First day</label><input type="date" id="n_s"></div><div class="f"><label for="n_e">Last day</label><input type="date" id="n_e"></div></div>
    ${bannerField('nb','')}
    <div class="f"><label for="n_org">Organizer code</label><input id="n_org" type="password" autocomplete="off" value="${esc(lsGet('tripbook-org'))}"><span class="hint">Only the owner and organizers can start trips. Ask Pennie if you need one. This phone remembers it after the first time.</span></div>
    <div class="f"><label for="n_code">Passcode for this trip</label><input id="n_code" autocomplete="off" autocapitalize="characters" spellcheck="false" style="font-family:var(--num);letter-spacing:.12em;font-size:18px;text-transform:uppercase"><span class="hint">At least 8 characters with at least one number. Text it only to the girls on this trip. They’ll see this trip and nothing else.</span></div>`,
  {saveLabel:'Create trip',onSave:async()=>{
    const name=val('n_name');if(!name)return 'Give the trip a name.';
    if(val('n_s')&&val('n_e')&&val('n_e')<val('n_s'))return 'The last day comes before the first day.';
    const org=val('n_org');if(!org)return 'Enter the organizer code.';
    const code=val('n_code').toUpperCase().replace(/\s+/g,'');if(code.length<8||!/\d/.test(code))return 'Make the passcode at least 8 characters with at least one number.';
    const id='trip-'+uid().toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,36);
    const nimg=val('nb_img')&&val('nb_img')!=='CLEAR'?val('nb_img'):'';
    const data={name,destination:val('n_dest'),startDate:val('n_s'),endDate:val('n_e'),...(nimg?{bannerAt:String(Date.now())}:{}),...(val('n_tp')?{template:val('n_tp')}:{})};
    let r;try{const res=await SB.rpc('trip_create',{p_trip:id,p_code:code,p_data:data,p_org:org});if(res.error)throw res.error;r=res.data}
    catch(e){return tooMany(e)?LOCKED:'Couldn’t create the trip. Check your connection and try again.'}
    if(r==='not-organizer')return 'That organizer code isn’t right. Only trip organizers can start a new trip.';
    if(r==='taken')return 'Another trip already uses that passcode. Pick a different one.';
    if(r==='too-weak')return 'Make the passcode at least 8 characters with at least one number.';
    if(r!=='ok')return 'Couldn’t create the trip. Try again.';
    lsSet('tripbook-org',org);
    if(nimg){try{const r1=await SB.rpc('trip_save',{p_trip:id,p_code:code,p_id:'banner:main',p_kind:'banner',p_data:{img:nimg}});if(!r1.error)bannerCacheSet(id,data.bannerAt,nimg)}catch(e){}}
    upsertTrip({id,code,...data,status:'',girls:0});setTimeout(()=>openTrip(id),30);return null;
  }});
  wireBanner('nb');
  {const n=$('#n_name'),c=$('#n_code');if(n&&c){n.addEventListener('input',()=>{if(!c.dataset.touched)c.value=n.value.trim()?suggestCode(n.value):''});c.addEventListener('input',()=>c.dataset.touched='1')}}
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-home]');if(!b||!SB)return;
  const a=b.dataset.home,id=b.dataset.id;
  if(a==='forget'){ev.stopPropagation();if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again to remove';return}forgetTrip(id);renderHome();toast('Removed from this phone');return}
  if(a==='owner-on'){ownerOnForm();return}
  if(a==='owner-off'){OWNER='';ORGS=null;lsSet('tripbook-owner','');renderHome();toast('Owner tools turned off on this phone');return}
  if(a==='org-add'){orgAddForm();return}
  if(a==='org-copy'){copyText(orgInvite(b.dataset.name,id),'Organizer invite for '+b.dataset.name,'Invite copied. Paste it in a text to '+b.dataset.name+'.');return}
  if(a==='org-remove'){if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again';return}
    SB.rpc('org_remove',{p_owner:OWNER,p_code:id}).then(()=>{toast(b.dataset.name+' is no longer an organizer');loadOrgs()});return}
  if(a==='open'){const t=myTrips().find(x=>x.id===id);if(t&&t.needsCode){joinForm('The passcode for '+(t.name||'this trip')+' changed. Enter the new one.');return}openTrip(id)}
  else if(a==='new')newTripForm();
  else if(a==='join')joinForm();
});

(async()=>{
  const C=window.TRIP_CONFIG||{};
  const configured=C.SUPABASE_URL&&!/PASTE_/.test(C.SUPABASE_URL)&&C.SUPABASE_ANON_KEY&&!/PASTE_/.test(C.SUPABASE_ANON_KEY);
  if(!configured||!window.supabase){renderHero();startApp(null);return}
  SB=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  $('#signout').addEventListener('click',()=>{lsSet(meKey(),'');ensureMe(true)});
  $('#mytrips').addEventListener('click',goHome);
  const act=lsGet(ACTIVE_KEY);const tr=myTrips().find(t=>t.id===act);
  if(tr){
    let ok=true;try{const {data,error}=await SB.rpc('trip_code_ok',{p_trip:tr.id,p_code:tr.code});if(error&&tooMany(error)){renderHome(LOCKED);return}if(!error)ok=data===true}catch(e){}
    if(ok){startApp(SB,tr);return}
    upsertTrip({id:tr.id,needsCode:true});lsSet(ACTIVE_KEY,'');
    renderHome('The passcode for '+(tr.name||'your trip')+' changed. Tap it to enter the new one.');refreshHome();return;
  }
  renderHome();refreshHome();loadOrgs();
})();
})();
