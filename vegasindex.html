<!doctype html>

<style>
/* Layout: one narrow column like a phone wallet — marquee header with bulb border, sticky tab bar, stacked sections. */
:root{
  --bg:#FBF5F2; --surface:#FFFFFF; --sunk:#F5ECEE; --ink:#2A1630; --muted:#7A6478; --line:#EADBE3;
  --accent:#B8155A; --accent-ink:#FFFFFF; --accent-soft:#F9E1EB; --gold:#B8860B; --marquee:#3A1240; --marquee-ink:#FFF4DA;
  --pos:#1D7A4E; --pos-soft:#E1F3E9; --neg:#B3261E; --neg-soft:#FBE4E1;
  --c1:#B8155A; --c2:#6A3FB5; --c3:#1D7A8C; --c4:#C2621A; --c5:#2E7D32; --c6:#8E2C8A; --c7:#3949AB; --c8:#A1522F;
  --display:"Limelight", "Didot", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#170D1C; --surface:#22152A; --sunk:#1C1123; --ink:#F7EAF1; --muted:#B9A2B6; --line:#3A2843;
  --accent:#FF5C9A; --accent-ink:#2A0716; --accent-soft:#3D1A2E; --gold:#E9BD55; --marquee:#2B0F33; --marquee-ink:#FFF1CC;
  --pos:#62D39C; --pos-soft:#153326; --neg:#FF8F85; --neg-soft:#3A1B1A;
  --c1:#FF5C9A; --c2:#A98BF0; --c3:#4FC3D4; --c4:#F2A15B; --c5:#7BCF80; --c6:#E07ADB; --c7:#8C9EFF; --c8:#E39A78;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#170D1C; --surface:#22152A; --sunk:#1C1123; --ink:#F7EAF1; --muted:#B9A2B6; --line:#3A2843;
  --accent:#FF5C9A; --accent-ink:#2A0716; --accent-soft:#3D1A2E; --gold:#E9BD55; --marquee:#2B0F33; --marquee-ink:#FFF1CC;
  --pos:#62D39C; --pos-soft:#153326; --neg:#FF8F85; --neg-soft:#3A1B1A;
  --c1:#FF5C9A; --c2:#A98BF0; --c3:#4FC3D4; --c4:#F2A15B; --c5:#7BCF80; --c6:#E07ADB; --c7:#8C9EFF; --c8:#E39A78;
  color-scheme:dark }

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* Marquee header */
.marquee{border-radius:22px;padding:11px;background:radial-gradient(circle,var(--gold) 2.4px,transparent 3.2px) 0 0/15px 15px,var(--marquee)}
.marquee-in{border-radius:13px;background:var(--marquee);color:var(--marquee-ink);padding:20px 20px 18px;display:grid;gap:10px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.marquee h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,46px);line-height:1.05;letter-spacing:.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;opacity:.92}
.meta b{font-weight:600}
.countdown{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--gold) 22%,transparent);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;width:max-content;max-width:100%}
.syncnote{font-size:12px;color:var(--muted);margin:8px 4px 0}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--muted);text-decoration:none}
.tab[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Sections */
main{display:grid;gap:22px;margin-top:18px}
.sec{display:grid;gap:10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:19px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}
.btn.danger.armed{background:var(--neg);color:var(--surface);border-color:var(--neg)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink)}

.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv a{color:var(--accent)}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.tile .v{font-size:16px}}

/* Girls */
.girls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.girl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;cursor:pointer;text-align:left}
.girl:hover{border-color:var(--accent)}
.girl-top{display:flex;align-items:center;gap:10px;min-width:0}
.girl-top div{min-width:0}
.girl-name{font-weight:700;font-size:16px}
.small{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--surface);background:var(--c1)}
.av.xs{width:24px;height:24px;font-size:10px;border:2px solid var(--surface)}
.stack{display:flex}.stack .av.xs+.av.xs{margin-left:-6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--sunk);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%}

/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row-main{min-width:0;display:grid;gap:3px}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-amt{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.row-amt small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px}
.dayhead h3{font-size:15px;font-weight:700}
.daynum{font-family:var(--display);font-size:22px;color:var(--accent);font-weight:400;margin-right:8px}
.time{font-family:var(--num);font-size:13px;color:var(--accent);font-weight:600;min-width:62px}
.plan{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:start}
.plan:first-child{border-top:0}
.plan:hover{background:var(--sunk)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:14px}

/* Settle */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
th,td{padding:10px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{border-top:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
th:first-child,td:first-child{text-align:left}
td.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.pos{background:var(--pos-soft)}.pill.neg{background:var(--neg-soft)}.pill.even{background:var(--sunk);color:var(--muted)}
.xfer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.xfer:first-child{border-top:0}
.xfer-who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.arrow{color:var(--muted);font-size:13px}
.xfer-amt{font-family:var(--num);font-weight:600;font-size:17px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 84px;gap:10px;align-items:center;font-size:14px}
.bar-track{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.bar .num{text-align:right}
@media (max-width:420px){.bar{grid-template-columns:86px 1fr 74px}}
.allset{background:var(--pos-soft);color:var(--pos);border-radius:var(--r);padding:14px 16px;font-weight:600}

/* Modal */
.overlay{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
@media (min-width:640px){.overlay{align-items:center;padding:20px}.sheet{border-radius:20px}}
.sheet h2{font-size:20px}
.fields{display:grid;gap:12px}
.f{display:grid;gap:4px;min-width:0}
.f label,.f .lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:16px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.checks{display:grid;gap:6px}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.check input[type=number]{width:110px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content}
.seg button{border:0;background:var(--bg);padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.err{color:var(--neg);font-size:14px;font-weight:600}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.foot .right{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.signin{max-width:420px;margin:22px auto 0;display:grid;gap:14px}
.signin .panel{display:grid;gap:12px;padding:20px}
.signin h2{font-size:20px}
.signin input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;width:100%}
.signin .btn{padding:11px 14px;font-size:15px}
.userbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;cursor:pointer;padding:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

<script>
(function(){
const COLS=['girls','expenses','plans','payments'];
const S={trip:{},girls:[],expenses:[],plans:[],payments:[],loaded:false};
const CATS=['Hotel','Food','Drinks','Shows & tickets','Clubs & cover','Ride share','Pool & spa','Shopping','Gambling','Flights','Tips','Other'];
const PLAN_KINDS=['Show','Dinner','Brunch','Club','Pool party','Spa','Shopping','Tour','Drinks','Flight','Other'];
const RIDE_SERVICES=['Uber','Lyft','Taxi','Hotel shuttle','Other'];
const TABS=[['trip','Trip & girls'],['plans','Calendar'],['expenses','Expenses'],['rides','Rides'],['settle','Who owes who']];
let tab='trip', backend=null, filterGirl='', readOnly=false;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=c=>((c||0)<0?'-':'')+'$'+(Math.abs(c||0)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const toCents=v=>{const n=parseFloat(String(v).replace(/[$,\s]/g,''));return isFinite(n)?Math.round(n*100):NaN};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9-]/g,'');
const pd=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayIso=()=>iso(new Date());
const dLong=s=>{const d=pd(s);return d?d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'No date'};
const dShort=s=>{const d=pd(s);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):''};
const t12=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return ((h%12)||12)+':'+String(m).padStart(2,'0')+(h<12?' am':' pm')};
const girl=id=>S.girls.find(g=>g.id===id);
const gname=id=>girl(id)?.name||'Someone';
const sortedGirls=()=>[...S.girls].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const gidx=id=>Math.max(0,sortedGirls().findIndex(g=>g.id===id));
const initials=n=>(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const av=(id,cls='')=>`<span class="av ${cls}" style="background:var(--c${gidx(id)%8+1})" title="${esc(gname(id))}">${esc(initials(gname(id)))}</span>`;
const catColor=c=>`var(--c${(CATS.indexOf(c)%8+8)%8+1})`;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

/* ---------- money math ---------- */
function shares(e){
  const out={};
  if(e.splitMode==='custom'){for(const k in (e.custom||{}))if(e.custom[k])out[k]=e.custom[k];return out}
  const ids=sortedGirls().map(g=>g.id).filter(id=>(e.splitAmong||[]).includes(id));
  if(!ids.length)return out;
  const base=Math.floor(e.amountCents/ids.length);let rem=e.amountCents-base*ids.length;
  ids.forEach(id=>{out[id]=base+(rem>0?1:0);if(rem>0)rem--});
  return out;
}
function balances(){
  const b={};sortedGirls().forEach(g=>b[g.id]={paid:0,share:0,sent:0,recv:0});
  const ensure=id=>b[id]||(b[id]={paid:0,share:0,sent:0,recv:0});
  S.expenses.forEach(e=>{ensure(e.paidBy).paid+=e.amountCents||0;const sh=shares(e);for(const k in sh)ensure(k).share+=sh[k]});
  S.payments.forEach(p=>{ensure(p.from).sent+=p.amountCents||0;ensure(p.to).recv+=p.amountCents||0});
  for(const k in b)b[k].net=b[k].paid-b[k].share+b[k].sent-b[k].recv;
  return b;
}
function transfers(b){
  const cred=[],debt=[];
  for(const k in b){const n=b[k].net;if(n>0)cred.push({id:k,n});else if(n<0)debt.push({id:k,n:-n})}
  cred.sort((a,c)=>c.n-a.n);debt.sort((a,c)=>c.n-a.n);
  const out=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){const amt=Math.min(debt[i].n,cred[j].n);if(amt>0)out.push({from:debt[i].id,to:cred[j].id,amt});debt[i].n-=amt;cred[j].n-=amt;if(!debt[i].n)i++;if(!cred[j].n)j++}
  return out;
}

/* ---------- storage ---------- */
function localBackend(){
  const KEY='vegas-girls-trip-v1';
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({trip:S.trip,girls:S.girls,expenses:S.expenses,plans:S.plans,payments:S.payments}))}catch(e){}};
  return{
    shared:false,
    start(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d)Object.assign(S,d)}catch(e){}S.loaded=true;render()},
    async save(col,id,obj){if(col==='trip'){S.trip=obj}else{const a=S[col],i=a.findIndex(x=>x.id===id);const r={...obj,id};i<0?a.push(r):a[i]=r}persist();render()},
    async remove(col,id){S[col]=S[col].filter(x=>x.id!==id);persist();render()}
  };
}
/* Supabase table: trip_items (trip_id, id, kind, data, updated_at). One row per girl/expense/plan/payment, plus one 'trip' row. */
function supaBackend(sb){
  const TRIP=window.TRIP_CONFIG.TRIP_ID;
  const apply=row=>{
    if(!row||row.trip_id!==TRIP)return;
    if(row.kind==='trip'){S.trip={...(row.data||{})};return}
    if(!COLS.includes(row.kind))return;
    const itemId=row.id.slice(row.kind.length+1);const a=S[row.kind];const i=a.findIndex(x=>x.id===itemId);const r={...(row.data||{}),id:itemId};
    i<0?a.push(r):a[i]=r;
  };
  const drop=row=>{if(!row||!row.id)return;const k=row.id.split(':')[0];if(COLS.includes(k)){const itemId=row.id.slice(k.length+1);S[k]=S[k].filter(x=>x.id!==itemId)}};
  async function loadAll(){
    const {data,error}=await sb.from('trip_items').select('*').eq('trip_id',TRIP);
    if(error)throw error;
    COLS.forEach(c=>S[c]=[]);S.trip={};(data||[]).forEach(apply);S.loaded=true;render();
  }
  return{
    shared:true,
    async start(){
      try{await loadAll()}catch(e){S.loaded=true;render();toast('Couldn’t load the trip. Check your connection and refresh.');return}
      sb.channel('trip-'+TRIP).on('postgres_changes',{event:'*',schema:'public',table:'trip_items'},p=>{
        if(p.eventType==='DELETE')drop(p.old);else apply(p.new);render();
      }).subscribe(st=>{live=st==='SUBSCRIBED';setSync()});
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadAll().catch(()=>{})});
    },
    async save(col,id,obj){
      const rowId=col==='trip'?'trip:main':col+':'+id;
      const {error}=await sb.from('trip_items').upsert({trip_id:TRIP,id:rowId,kind:col,data:obj,updated_at:new Date().toISOString()});
      if(error)throw error;
      apply({trip_id:TRIP,id:rowId,kind:col,data:obj});render();
    },
    async remove(col,id){
      const rowId=col+':'+id;
      const {error}=await sb.from('trip_items').delete().eq('trip_id',TRIP).eq('id',rowId);
      if(error)throw error;
      drop({id:rowId});render();
    }
  };
}
let live=false;
async function write(fn){
  try{await fn();return null}
  catch(e){
    if(e&&(e.code==='42501'||/row-level security|permission/i.test(e.message||'')))return 'You’re signed out or don’t have access. Sign out and sign back in with your email.';
    return 'That didn’t save. Check your connection and try again.';
  }
}
function setSync(){
  const el=$('#sync');
  if(!backend){el.textContent='Connecting…';return}
  el.textContent=!backend.shared?'Demo mode — saved on this device only until the database is connected.':live?'Live — everyone’s changes show up instantly.':'Shared trip — connecting to live updates…';
}

function tripDays(){
  const s=pd(S.trip.startDate),e=pd(S.trip.endDate);const set=new Set();
  if(s&&e&&e>=s&&(e-s)/864e5<31){for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))set.add(iso(d))}
  S.plans.forEach(p=>p.date&&set.add(p.date));
  S.expenses.filter(x=>x.ride&&x.date&&x.ride.time).forEach(x=>set.add(x.date));
  return [...set].sort();
}

    <div class="f"><label for="t_name">Trip name</label><input id="t_name" value="${esc(t.name||'Vegas Girls Trip')}"></div>
    <div class="two"><div class="f"><label for="t_s">First day</label><input type="date" id="t_s" value="${esc(t.startDate)}"></div><div class="f"><label for="t_e">Last day</label><input type="date" id="t_e" value="${esc(t.endDate)}"></div></div>
    <div class="f"><label for="t_h">Hotel</label><input id="t_h" value="${esc(t.hotelName)}" placeholder="e.g. Bellagio"></div>
    <div class="f"><label for="t_a">Hotel address</label><input id="t_a" value="${esc(t.hotelAddress)}"></div>
    <div class="two"><div class="f"><label for="t_p">Hotel phone</label><input id="t_p" inputmode="tel" value="${esc(t.hotelPhone)}"></div><div class="f"><label for="t_c">Confirmation #</label><input id="t_c" value="${esc(t.confirmation)}"></div></div>
    <div class="f"><label for="t_bu">Booked under</label><input id="t_bu" value="${esc(t.bookedUnder)}" placeholder="Whose name is on the reservation"></div>
    <div class="two"><div class="f"><label for="t_ci">Check-in</label><input type="date" id="t_ci" value="${esc(t.checkIn)}"></div><div class="f"><label for="t_cit">Check-in time</label><input id="t_cit" value="${esc(t.checkInTime||'3 pm')}"></div></div>
    <div class="two"><div class="f"><label for="t_co">Check-out</label><input type="date" id="t_co" value="${esc(t.checkOut)}"></div><div class="f"><label for="t_cot">Check-out time</label><input id="t_cot" value="${esc(t.checkOutTime||'11 am')}"></div></div>
    <div class="f"><label for="t_r">Rooms & who’s in them</label><input id="t_r" value="${esc(t.rooms)}" placeholder="e.g. Rm 2214: Pennie & Jess"></div>
    <div class="f"><label for="t_w">Wi-Fi</label><input id="t_w" value="${esc(t.wifi)}"></div>
    <div class="f"><label for="t_em">Emergency contacts</label><textarea id="t_em">${esc(t.emergency)}</textarea></div>
    <div class="f"><label for="t_n">Notes</label><textarea id="t_n" placeholder="Dress code for Saturday, pool cabana info, flights…">${esc(t.notes)}</textarea></div>`,
  {onSave:async()=>{
    if(val('t_s')&&val('t_e')&&val('t_e')<val('t_s'))return 'The last day comes before the first day.';
    const o={name:val('t_name'),startDate:val('t_s'),endDate:val('t_e'),hotelName:val('t_h'),hotelAddress:val('t_a'),hotelPhone:val('t_p'),confirmation:val('t_c'),bookedUnder:val('t_bu'),checkIn:val('t_ci'),checkInTime:val('t_cit'),checkOut:val('t_co'),checkOutTime:val('t_cot'),rooms:val('t_r'),wifi:val('t_w'),emergency:val('t_em'),notes:val('t_n')};
    return write(()=>backend.save('trip','main',o));
  }});
}

function girlForm(id){
  const g=id?girl(id):{};
  const used=id&&(S.expenses.some(e=>e.paidBy===id||shares(e)[id])||S.payments.some(p=>p.from===id||p.to===id));
  openModal(id?'Edit '+(g.name||''):'Add a girl',`
    <div class="f"><label for="g_n">Name</label><input id="g_n" value="${esc(g.name)}" autocomplete="off"></div>
    <div class="two"><div class="f"><label for="g_p">Phone</label><input id="g_p" inputmode="tel" value="${esc(g.phone)}"></div><div class="f"><label for="g_v">Venmo / Zelle / Cash App</label><input id="g_v" value="${esc(g.payHandle)}" placeholder="@venmo-name"></div></div>
    <div class="f"><label for="g_c">Cards she might use</label><input id="g_c" value="${esc(g.cards)}" placeholder="Chase Sapphire 4417, Amex Gold"><span class="hint">Separate with commas. Use a nickname or the last 4 digits only — never the full card number.</span></div>`,
  {onSave:async()=>{
    const name=val('g_n');if(!name)return 'Add her name.';
    if(/\d{12,}/.test(val('g_c').replace(/[\s-]/g,'')))return 'That looks like a full card number. Use only the last 4 digits.';
    const o={name,phone:val('g_p'),payHandle:val('g_v'),cards:val('g_c'),createdAt:g.createdAt||Date.now()};
    return write(()=>backend.save('girls',id||uid(),o));
  },onDelete:id?async()=>used?`${g.name} has expenses or payments. Remove those first so the math stays right.`:write(()=>backend.remove('girls',id)):null});
}

function cardList(gid){const g=girl(gid);return (g?.cards||'').split(',').map(s=>s.trim()).filter(Boolean)}
function expForm(id,preset={}){
  if(!S.girls.length){girlForm();return}
  const e=id?S.expenses.find(x=>x.id===id):{category:'Food',date:todayIso(),splitMode:'equal',splitAmong:S.girls.map(g=>g.id),...preset};
  const isRide=()=>val('e_cat')==='Ride share';
  const custom=e.custom||{};
  openModal(id?'Edit expense':preset.category==='Ride share'?'Add a ride':'Add expense',`
    <div class="two"><div class="f"><label for="e_t">What for?</label><input id="e_t" value="${esc(e.title)}" placeholder="${preset.category==='Ride share'?'Uber to the Strip':'Dinner at Nobu'}"></div>
      <div class="f"><label for="e_a">Amount (with tip & tax)</label><input id="e_a" inputmode="decimal" value="${e.amountCents?(e.amountCents/100).toFixed(2):''}" placeholder="0.00"></div></div>
    <div class="two"><div class="f"><label for="e_cat">Category</label><select id="e_cat">${opts(CATS,e.category)}</select></div><div class="f"><label for="e_d">Date</label><input type="date" id="e_d" value="${esc(e.date)}"></div></div>
    <div id="ridebox" class="fields" ${e.category==='Ride share'?'':'hidden'}>
      <div class="two"><div class="f"><label for="r_s">Service</label><select id="r_s">${opts(RIDE_SERVICES,e.ride?.service||'Uber')}</select></div><div class="f"><label for="r_t">Pickup time</label><input type="time" id="r_t" value="${esc(e.ride?.time)}"></div></div>
      <div class="two"><div class="f"><label for="r_f">From</label><input id="r_f" value="${esc(e.ride?.from)}" placeholder="Harry Reid Airport"></div><div class="f"><label for="r_to">To</label><input id="r_to" value="${esc(e.ride?.to)}" placeholder="Hotel"></div></div>
    </div>
    <div class="two"><div class="f"><label for="e_pb">Who paid?</label><select id="e_pb">${girlOpts(e.paidBy||sortedGirls()[0].id)}</select></div>
      <div class="f"><label for="e_card">Card used</label><input id="e_card" list="cardlist" value="${esc(e.card)}" placeholder="Card nickname or last 4"><datalist id="cardlist"></datalist></div></div>
    <div class="f"><span class="lbl">Split between</span>
      <div class="seg" role="group"><button type="button" data-split="equal" aria-pressed="${e.splitMode!=='custom'}">Equally</button><button type="button" data-split="custom" aria-pressed="${e.splitMode==='custom'}">Custom amounts</button></div>
      <input type="hidden" id="e_sm" value="${e.splitMode==='custom'?'custom':'equal'}">
      <div class="checks" id="splitbox">${sortedGirls().map(g=>`<label class="check"><input type="checkbox" id="sp_${g.id}" ${e.splitMode==='custom'?(custom[g.id]?'checked':''):(e.splitAmong||[]).includes(g.id)?'checked':''}><span>${esc(g.name)}</span><input type="number" step="0.01" min="0" inputmode="decimal" id="cu_${g.id}" value="${custom[g.id]?(custom[g.id]/100).toFixed(2):''}" ${e.splitMode==='custom'?'':'hidden'} aria-label="${esc(g.name)} amount"></label>`).join('')}</div>
      <span class="hint" id="splithint"></span></div>
    <div class="f"><label for="e_n">Notes</label><input id="e_n" value="${esc(e.notes)}" placeholder="Optional"></div>`,
  {onSave:async()=>{
    const title=val('e_t'),amt=toCents(val('e_a'));
    if(!title)return 'Say what the expense was for.';
    if(!(amt>0))return 'Enter the amount, like 84.50.';
    if(/\d{12,}/.test(val('e_card').replace(/[\s-]/g,'')))return 'That looks like a full card number. Use a nickname or last 4 only.';
    const mode=val('e_sm');const o={title,amountCents:amt,category:val('e_cat'),date:val('e_d'),paidBy:val('e_pb'),card:val('e_card'),notes:val('e_n'),splitMode:mode,createdAt:e.createdAt||Date.now()};
    if(mode==='custom'){const c={};let sum=0;sortedGirls().forEach(g=>{const v=toCents(val('cu_'+g.id)||'0');if(document.getElementById('sp_'+g.id).checked&&v>0){c[g.id]=v;sum+=v}});
      if(!sum)return 'Enter how much each girl owes.';
      if(sum!==amt)return `Custom amounts add up to ${fmt(sum)} but the expense is ${fmt(amt)}.`;
      o.custom=c;o.splitAmong=Object.keys(c);}
    else{o.splitAmong=sortedGirls().filter(g=>document.getElementById('sp_'+g.id).checked).map(g=>g.id);if(!o.splitAmong.length)return 'Pick at least one girl to split with.';}
    if(o.category==='Ride share')o.ride={service:val('r_s'),time:val('r_t'),from:val('r_f'),to:val('r_to')};
    return write(()=>backend.save('expenses',id||uid(),o));
  },onDelete:id?async()=>write(()=>backend.remove('expenses',id)):null});
  const syncCards=()=>{$('#cardlist').innerHTML=cardList(val('e_pb')).map(c=>`<option value="${esc(c)}">`).join('');if(!id&&!val('e_card')){const c=cardList(val('e_pb'));if(c.length===1)$('#e_card').value=c[0]}};
  const hint=()=>{const amt=toCents(val('e_a'))||0;
    if(val('e_sm')==='custom'){let sum=0;sortedGirls().forEach(g=>{if(document.getElementById('sp_'+g.id).checked)sum+=toCents(val('cu_'+g.id)||'0')||0});const left=amt-sum;$('#splithint').textContent=left===0?'Adds up.':left>0?`${fmt(left)} left to assign`:`${fmt(-left)} too much`}
    else{const n=sortedGirls().filter(g=>document.getElementById('sp_'+g.id).checked).length;$('#splithint').textContent=n&&amt?`${fmt(Math.floor(amt/n))} each, ${n} way${n===1?'':'s'}`:''}};
  syncCards();hint();
  $('#e_pb').addEventListener('change',()=>{$('#e_card').value='';syncCards()});
  $('#e_cat').addEventListener('change',()=>$('#ridebox').hidden=!isRide());
  $('#mform').addEventListener('input',hint);
  $('#mform').querySelectorAll('[data-split]').forEach(b=>b.addEventListener('click',()=>{const m=b.dataset.split;$('#e_sm').value=m;$('#mform').querySelectorAll('[data-split]').forEach(x=>x.setAttribute('aria-pressed',x===b));sortedGirls().forEach(g=>document.getElementById('cu_'+g.id).hidden=m!=='custom');hint()}));
}

function planForm(id,date){
  const p=id?S.plans.find(x=>x.id===id):{kind:'Dinner',date:date||S.trip.startDate||'',going:S.girls.map(g=>g.id)};
  openModal(id?'Edit plan':'Add a plan',`
    <div class="f"><label for="p_t">What’s the plan?</label><input id="p_t" value="${esc(p.title)}" placeholder="Brunch at Mon Ami Gabi"></div>
    <div class="two"><div class="f"><label for="p_k">Type</label><select id="p_k">${opts(PLAN_KINDS,p.kind)}</select></div><div class="f"><label for="p_l">Where</label><input id="p_l" value="${esc(p.location)}"></div></div>
    <div class="two"><div class="f"><label for="p_d">Date</label><input type="date" id="p_d" value="${esc(p.date)}"><span class="hint">Leave blank for “someday” ideas.</span></div><div class="f"><label for="p_tm">Time</label><input type="time" id="p_tm" value="${esc(p.time)}"></div></div>
    <div class="two"><div class="f"><label for="p_c">Confirmation #</label><input id="p_c" value="${esc(p.confirmation)}"></div><div class="f"><label for="p_cost">Cost per person</label><input id="p_cost" value="${esc(p.cost)}" placeholder="$85"></div></div>
    ${S.girls.length?`<div class="f"><span class="lbl">Who’s going</span><div class="checks">${sortedGirls().map(g=>`<label class="check"><input type="checkbox" id="pg_${g.id}" ${(p.going||[]).includes(g.id)?'checked':''}><span>${esc(g.name)}</span><span></span></label>`).join('')}</div></div>`:''}
    <div class="f"><label for="p_n">Notes</label><input id="p_n" value="${esc(p.notes)}" placeholder="Dress code, who booked it…"></div>`,
  {onSave:async()=>{
    const title=val('p_t');if(!title)return 'Give the plan a name.';
    const o={title,kind:val('p_k'),location:val('p_l'),date:val('p_d'),time:val('p_tm'),confirmation:val('p_c'),cost:val('p_cost'),notes:val('p_n'),going:sortedGirls().filter(g=>document.getElementById('pg_'+g.id)?.checked).map(g=>g.id),createdAt:p.createdAt||Date.now()};
    return write(()=>backend.save('plans',id||uid(),o));
  },onDelete:id?async()=>write(()=>backend.remove('plans',id)):null});
}

function payForm(id,pre={}){
  const p=id?S.payments.find(x=>x.id===id):{from:pre.from||sortedGirls()[0]?.id,to:pre.to||sortedGirls()[1]?.id,amountCents:pre.amt||0,date:todayIso(),method:'Venmo'};
  openModal(id?'Edit payment':'Record a payment',`
    <div class="two"><div class="f"><label for="y_f">Who paid</label><select id="y_f">${girlOpts(p.from)}</select></div><div class="f"><label for="y_t">Paid to</label><select id="y_t">${girlOpts(p.to)}</select></div></div>
    <div class="two"><div class="f"><label for="y_a">Amount</label><input id="y_a" inputmode="decimal" value="${p.amountCents?(p.amountCents/100).toFixed(2):''}"></div><div class="f"><label for="y_m">How</label><select id="y_m">${opts(['Venmo','Zelle','Cash App','Apple Cash','PayPal','Cash','Other'],p.method)}</select></div></div>
    <div class="f"><label for="y_d">Date</label><input type="date" id="y_d" value="${esc(p.date)}"></div>`,
  {saveLabel:id?'Save':'Mark as paid',onSave:async()=>{
    const amt=toCents(val('y_a'));if(!(amt>0))return 'Enter the amount paid.';
    if(val('y_f')===val('y_t'))return 'Pick two different girls.';
    const o={from:val('y_f'),to:val('y_t'),amountCents:amt,method:val('y_m'),date:val('y_d'),createdAt:p.createdAt||Date.now()};
    return write(()=>backend.save('payments',id||uid(),o));
  },onDelete:id?async()=>write(()=>backend.remove('payments',id)):null});
}

function summaryText(){
  const b=balances();const xs=transfers(b);const total=S.expenses.reduce((s,e)=>s+e.amountCents,0);
  const lines=[`${S.trip.name||'Vegas Girls Trip'} — settle up`,`Total spent: ${fmt(total)}`,''];
  if(xs.length){lines.push('Payments to make:');xs.forEach(x=>{const h=girl(x.to)?.payHandle;lines.push(`• ${gname(x.from)} pays ${gname(x.to)} ${fmt(x.amt)}${h?' ('+h+')':''}`)})}else lines.push('Everyone is even!');
  lines.push('','Each girl’s share:');sortedGirls().forEach(g=>lines.push(`• ${g.name}: spent ${fmt(b[g.id].share)}, paid ${fmt(b[g.id].paid)}`));
  return lines.join('\n');
}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-act]');
  if(ev.target.id==='overlay'){closeModal();return}
  if(ev.target.id==='mcancel'){closeModal();return}
  if(ev.target.id==='mdel'){const b=ev.target;if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again to delete';return}
    const err=await modalCtx.onDelete();if(err)merr(err);else{closeModal();toast('Deleted')}return}
  if(!t||t.tagName==='SELECT')return;
  if(readOnly&&!['copy','filter'].includes(t.dataset.act)){toast('This trip is view only for you.');return}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='trip-edit')tripForm();
  else if(a==='girl-new')girlForm();
  else if(a==='girl-edit')girlForm(id);
  else if(a==='exp-new')expForm();
  else if(a==='ride-new')expForm(null,{category:'Ride share',title:'Uber'});
  else if(a==='exp-edit')expForm(id);
  else if(a==='plan-new')planForm(null,t.dataset.date);
  else if(a==='plan-edit')planForm(id);
  else if(a==='pay-new')payForm(null,{from:t.dataset.from,to:t.dataset.to,amt:+t.dataset.amt||0});
  else if(a==='pay-edit')payForm(id);
  else if(a==='copy'){const txt=summaryText();try{await navigator.clipboard.writeText(txt);toast('Summary copied — paste it in the group chat')}catch(e){openModal('Settle-up summary',`<div class="f"><textarea id="sumtxt" style="min-height:220px">${esc(txt)}</textarea><span class="hint">Select all and copy.</span></div>`,{onSave:async()=>null,saveLabel:'Done'});setTimeout(()=>$('#sumtxt').select(),50)}}
});
document.addEventListener('change',ev=>{if(ev.target.id==='fg'){filterGirl=ev.target.value;render()}});
document.addEventListener('submit',async ev=>{
  if(ev.target.id!=='mform')return;ev.preventDefault();
  const btn=ev.target.querySelector('[type=submit]');btn.disabled=true;
  const err=await modalCtx.onSave();btn.disabled=false;
  if(err)merr(err);else{closeModal();toast('Saved')}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#overlay').hidden)closeModal()});
function route(){const h=location.hash.slice(1);tab=TABS.some(t=>t[0]===h)?h:'trip';render();}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});

/* ---------- boot ---------- */
function showApp(on){$('#signin').hidden=on;$('#tabs').hidden=!on;$('#main').hidden=!on}
function showSignin(){
  showApp(false);renderHero();$('#sync').textContent='Sign in to see the trip.';$('#signout').hidden=true;
  $('#signinform').hidden=false;$('#si_sent').hidden=true;
}
let started=false;
function startApp(sb,email){
  showApp(true);$('#signout').hidden=!sb;
  if(email)$('#signout').textContent='Sign out ('+email+')';
  if(started)return;started=true;
  backend=sb?supaBackend(sb):localBackend();
  route();backend.start();setSync();
}
(async()=>{
  renderHero();
  const C=window.TRIP_CONFIG||{};
  const configured=C.SUPABASE_URL&&!/PASTE_/.test(C.SUPABASE_URL)&&C.SUPABASE_ANON_KEY&&!/PASTE_/.test(C.SUPABASE_ANON_KEY);
  if(!configured||!window.supabase){startApp(null);return}
  const sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  $('#signinform').addEventListener('submit',async ev=>{
    ev.preventDefault();const email=$('#si_email').value.trim();const err=$('#si_err');err.hidden=true;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Enter a full email address, like jess@gmail.com.';err.hidden=false;return}
    const b=$('#si_btn');b.disabled=true;b.textContent='Sending…';
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
    b.disabled=false;b.textContent='Email me a sign-in link';
    if(error){err.textContent=/rate/i.test(error.message)?'Too many links sent. Wait a minute and try again.':'Couldn’t send the link. Check the email and try again.';err.hidden=false;return}
    $('#si_to').textContent=email;$('#signinform').hidden=true;$('#si_sent').hidden=false;
  });
  $('#si_again').addEventListener('click',()=>{$('#signinform').hidden=false;$('#si_sent').hidden=true});
  $('#signout').addEventListener('click',async()=>{await sb.auth.signOut();location.hash='';location.reload()});
  sb.auth.onAuthStateChange((evt,session)=>{if(session)startApp(sb,session.user.email)});
  const {data:{session}}=await sb.auth.getSession();
  if(session)startApp(sb,session.user.email);else showSignin();
})();
})();
</script>
